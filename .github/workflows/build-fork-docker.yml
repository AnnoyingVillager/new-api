name: Build fork Docker image

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: codex/responses-compat
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve upstream version
        shell: bash
        env:
          UPSTREAM_REPOSITORY: https://github.com/QuantumNous/new-api.git
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --force --tags upstream '+refs/heads/main:refs/remotes/upstream/main'

          upstream_base="$(git merge-base HEAD upstream/main)"
          version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$upstream_base")"
          echo "$version" > VERSION

          echo "Resolved upstream version: $version"
          echo "Upstream base: $upstream_base"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/annoyingvillager/new-api
          tags: |
            type=raw,value=responses-compat,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.ref == 'codex/responses-compat') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/responses-compat') }}
            type=ref,event=branch,prefix=branch-
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.ref == 'codex/responses-compat') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/responses-compat') }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
